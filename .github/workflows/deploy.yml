name: Deploy consumer web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/build-consumer.mjs
        env:
          NEXT_PUBLIC_SERVICE_ORIGIN: ${{ vars.NEXT_PUBLIC_SERVICE_ORIGIN }}
          # Empty BASE_PATH (custom domain / root hosting) can be set via repo variable BASE_PATH.
          BASE_PATH: ${{ vars.BASE_PATH != '' && vars.BASE_PATH || '/mil-abbreviation' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
